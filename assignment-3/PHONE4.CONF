# Dedicated configuration; the launcher supplies the actual loopback COM1 port.
[sdl]
fullscreen=false
windowresolution=1280x960
output=openglnb
[render]
aspect=true
[dosbox]
memsize=16
[cpu]
core=normal
cycles=fixed 50000
[mixer]
nosound=true
[midi]
mpu401=none
[sblaster]
sbtype=none
[serial]
serial1=nullmodem server:127.0.0.1 port:8766 transparent:1 rxdelay:1000
